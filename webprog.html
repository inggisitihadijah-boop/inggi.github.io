    const defaultConfig = {
      school_name: 'SMA Nusantara Unggul',
      school_motto: 'Berilmu, Berakhlak, Berprestasi',
      hero_title: 'Membangun Generasi Unggul dan Berkarakter',
      hero_subtitle: 'Sekolah kami berkomitmen menciptakan lingkungan belajar yang kondusif untuk mengembangkan potensi akademik dan karakter siswa secara optimal.'
    };

    const pages = {
      home: 'page-home',
      profil: 'page-profil',
      akademik: 'page-akademik',
      kegiatan: 'page-kegiatan',
      fasilitas: 'page-fasilitas',
      berita: 'page-berita',
      ppdb: 'page-ppdb',
      kontak: 'page-kontak'
    };

    window.app = {
      navigate: function(pageId) {
        const templateId = pages[pageId];
        if (!templateId) return;

        const template = document.getElementById(templateId);
        const content = document.getElementById('page-content');
        
        content.innerHTML = '';
        
        const headerTemplate = document.getElementById('header-template');
        content.appendChild(headerTemplate.content.cloneNode(true));
        
        if (template) {
          content.appendChild(template.content.cloneNode(true));
        }
        
        const footerTemplate = document.getElementById('footer-template');
        content.appendChild(footerTemplate.content.cloneNode(true));

        window.scrollTo(0, 0);
        this.attachEventListeners();
      },

      attachEventListeners: function() {
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        if (mobileMenuBtn) {
          mobileMenuBtn.onclick = () => {
            const mobileNav = document.getElementById('mobile-nav');
            mobileNav.classList.toggle('hidden');
          };
        }

        const contactForm = document.getElementById('contact-form');
        if (contactForm) {
          contactForm.onsubmit = (e) => {
            e.preventDefault();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'p-4 bg-emerald-100 text-emerald-700 rounded-xl mt-4';
            messageDiv.textContent = '✓ Pesan Anda telah terkirim!';
            contactForm.after(messageDiv);
            contactForm.reset();
            setTimeout(() => messageDiv.remove(), 3000);
          };
        }

        const ppdbForm = document.getElementById('ppdb-form');
        if (ppdbForm) {
          ppdbForm.onsubmit = (e) => {
            e.preventDefault();
            const messageEl = document.getElementById('ppdb-message');
            messageEl.textContent = '✓ Pendaftaran berhasil! Cek email Anda untuk informasi selanjutnya.';
            messageEl.classList.remove('hidden');
            ppdbForm.reset();
            setTimeout(() => messageEl.classList.add('hidden'), 5000);
          };
        }
      }
    };

    window.addEventListener('DOMContentLoaded', function() {
      window.app.navigate('home');
    });
  </script>
